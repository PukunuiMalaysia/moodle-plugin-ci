name: Moodle Plugin CI

on:
  workflow_call:
    inputs:
      release-validation:
        description: Mandatory exact-package validation; ignores skip moodle-ci markers.
        type: boolean
        default: false
      release-sha:
        type: string
        default: ''
      release-tools-ref:
        description: Reviewed full SHA of this repository's packaging tools.
        type: string
        default: ''
      package-sha256:
        type: string
        default: ''
      component:
        type: string
        default: ''
      upgrade-from-sha:
        description: Previous supported plugin commit for the upgrade lane.
        type: string
        default: ''
      installation-modes:
        type: string
        default: '["fresh"]'
      moodle-branch:
        description: JSON array of Moodle branches to test.
        required: false
        default: '["MOODLE_405_STABLE", "MOODLE_501_STABLE", "MOODLE_502_STABLE"]'
        type: string
      php-versions:
        description: JSON array of PHP versions to test.
        required: false
        default: '["8.1", "8.2", "8.3", "8.4"]'
        type: string
      run-grunt:
        description: Run moodle-plugin-ci grunt.
        required: false
        default: true
        type: boolean
      moodle-plugin-ci-version:
        description: Exact moodlehq/moodle-plugin-ci release to install.
        required: false
        default: '4.5.11'
        type: string
      additional-plugin-repositories:
        description: JSON array of additional Moodle plugin repositories to install before tests.
        required: false
        default: '[]'
        type: string

permissions:
  contents: read

jobs:
  test:
    # The github context belongs to the caller, so callers can skip only this
    # reusable Moodle CI job without suppressing their other workflows.
    if: >-
      ${{
        inputs.release-validation || (
        !contains(github.event.head_commit.message, '[skip moodle-ci]') &&
        !contains(github.event.pull_request.title, '[skip moodle-ci]') &&
        !contains(github.event.pull_request.body, '[skip moodle-ci]'))
      }}
    name: ${{ inputs.release-validation && format('test ({0}, {1}, {2}, {3})', matrix.php, matrix.moodle-branch, matrix.database, matrix.installation) || format('test ({0}, {1}, {2})', matrix.php, matrix.moodle-branch, matrix.database) }}
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3

      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_USER: 'root'
          MYSQL_ALLOW_EMPTY_PASSWORD: "true"
          MYSQL_CHARACTER_SET_SERVER: "utf8mb4"
          MYSQL_COLLATION_SERVER: "utf8mb4_unicode_ci"
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval 10s --health-timeout 5s --health-retries 3

    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON(inputs.php-versions) }}
        moodle-branch: ${{ fromJSON(inputs.moodle-branch) }}
        database: [pgsql, mariadb]
        installation: ${{ fromJSON(inputs.installation-modes) }}
        exclude:
          - php: '8.1'
            moodle-branch: 'MOODLE_501_STABLE'
          - php: '8.1'
            moodle-branch: 'MOODLE_502_STABLE'
          - php: '8.2'
            moodle-branch: 'MOODLE_502_STABLE'
          - php: '8.4'
            moodle-branch: 'MOODLE_405_STABLE'

    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          path: plugin
          ref: ${{ inputs.release-validation && inputs.release-sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out reviewed release tools
        if: ${{ inputs.release-validation }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          repository: PukunuiMalaysia/moodle-plugin-ci
          ref: ${{ inputs.release-tools-ref }}
          path: release-tools
          persist-credentials: false

      - name: Prepare exact release ZIP for installation
        if: ${{ inputs.release-validation }}
        env:
          RELEASE_SHA: ${{ inputs.release-sha }}
          TOOLS_SHA: ${{ inputs.release-tools-ref }}
          PACKAGE_SHA256: ${{ inputs.package-sha256 }}
          COMPONENT: ${{ inputs.component }}
          UPGRADE_SHA: ${{ inputs.upgrade-from-sha }}
          INSTALLATION: ${{ matrix.installation }}
        run: |
          (cd release-tools && python3 -m unittest discover -s tests)
          python3 release-tools/scripts/prepare_release_ci.py

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          ini-values: max_input_vars=5000
          # If you are not using code coverage, keep "none". Otherwise, use "pcov" (Moodle 3.10 and up) or "xdebug".
          # If you try to use code coverage with "none", it will fallback to phpdbg (which has known problems).
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci "${{ inputs.moodle-plugin-ci-version }}"
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Install moodle-plugin-ci
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}
          # Uncomment this to run Behat tests using the Moodle App.
          # MOODLE_APP: 'true'

      - name: Install additional Moodle plugin dependencies
        if: ${{ inputs.additional-plugin-repositories != '[]' }}
        env:
          ADDITIONAL_PLUGIN_REPOSITORIES: ${{ inputs.additional-plugin-repositories }}
        run: |
          set -euo pipefail
          echo "$ADDITIONAL_PLUGIN_REPOSITORIES" | jq -e 'all(.[]; (.repository | type == "string") and (.path | type == "string"))' >/dev/null
          while IFS= read -r dependency; do
            repository=$(jq -er '.repository' <<<"$dependency")
            path=$(jq -er '.path' <<<"$dependency")
            if [[ ! "$path" =~ ^[a-z][a-z0-9_]+/[a-z][a-z0-9_]+$ ]]; then
              echo "Invalid Moodle plugin path: $path" >&2
              exit 1
            fi
            target="moodle/$path"
            if [[ -e "$target" ]]; then
              echo "Moodle plugin path already exists: $path" >&2
              exit 1
            fi
            git clone --depth 1 "$repository" "$target"
          done < <(jq -c '.[]' <<<"$ADDITIONAL_PLUGIN_REPOSITORIES")
          php moodle/admin/cli/upgrade.php --non-interactive

      - name: Validate upgrade from reviewed previous version
        if: ${{ inputs.release-validation && matrix.installation == 'upgrade' }}
        env:
          COMPONENT: ${{ inputs.component }}
        run: python3 release-tools/scripts/upgrade_release_ci.py

      - name: PHP Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: PHP Mess Detector
        continue-on-error: ${{ !inputs.release-validation }}
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpmd

      - name: Moodle Code Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: Moodle PHPDoc Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Validating
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      - name: Mustache Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci mustache

      - name: Grunt
        if: ${{ !cancelled() && inputs.run-grunt }}
        run: moodle-plugin-ci grunt --max-lint-warnings 0

      - name: PHPUnit tests
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --fail-on-warning

      - name: Behat features
        id: behat
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci behat --profile chrome --scss-deprecations

      - name: Upload Behat Faildump
        if: ${{ failure() && steps.behat.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Behat Faildump (${{ join(matrix.*, ', ') }})
          path: ${{ github.workspace }}/moodledata/behat_dump
          retention-days: 7
          if-no-files-found: ignore

      - name: Mark cancelled jobs as failed.
        if: ${{ cancelled() }}
        run: exit 1
